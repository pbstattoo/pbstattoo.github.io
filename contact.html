<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - PB'S TATTOO</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --surface: #0e0e10; --border: rgba(255, 255, 255, 0.08); --surface-hover: #16161a; --text-primary: #ffffff; --text-secondary: #86868b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text-primary); padding-top: 120px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .reveal { opacity: 0; transform: translateY(40px); transition: all 1s; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        
        header { position: fixed; top: 0; width: 100%; z-index: 1000; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background: rgba(0, 0, 0, 0.75); border-bottom: 1px solid var(--border); }
        nav { max-width: 1120px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; width: 100%; }
        .logo { display: flex; align-items: center; text-decoration: none; font-size: 1.05rem; font-weight: 800; letter-spacing: 0.1em; color: #fff; }
        .nav-links { display: flex; gap: 28px; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        .nav-links a:hover { color: var(--text-primary); }

        .contact-card { background: var(--surface); border: 1px solid var(--border); border-radius: 32px; padding: 50px 40px; max-width: 500px; width: 90%; text-align: center; margin-bottom: 40px; }
        .contact-card h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .contact-card p { color: var(--text-secondary); margin-bottom: 40px; }

        .social-btn { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; color: #fff; text-decoration: none; font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; transition: all 0.3s; }
        .social-btn:hover { background: var(--surface-hover); transform: translateY(-4px); border-color: rgba(255,255,255,0.2); }
        .social-btn.wa { border-left: 4px solid #25d366; }
        .social-btn.ig { border-left: 4px solid #E1306C; }
        .social-btn.yt { border-left: 4px solid #FF0000; }
        
        .icon-label { display: flex; align-items: center; gap: 12px; }
        .sub-text { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; }

        @media (max-width: 860px) { .nav-links { display: none; } }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <img src="logo.png" alt="PB'S TATTOO" style="height: 35px; width: auto;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span style="display:none;">PB'S TATTOO</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="gallery.html">Gallery & Styles</a>
                <a href="contact.html" style="color: #fff;">Contact</a>
            </div>
        </nav>
    </header>

    <div class="contact-card reveal">
        <h1>Let's Create.</h1>
        <p>Book a consultation or follow our latest work.</p>

        <!-- WhatsApp -->
        <a href="https://wa.me/917972693178" target="_blank" class="social-btn wa">
            <div class="icon-label">WhatsApp</div>
            <span class="sub-text">Book Now</span>
        </a>

        <!-- Instagram -->
        <a href="https://instagram.com/pb_tattoo" target="_blank" class="social-btn ig">
            <div class="icon-label">Instagram</div>
            <span class="sub-text">@pb_tattoo</span>
        </a>

        <!-- YouTube -->
        <a href="https://youtube.com/@pbstattoo" target="_blank" class="social-btn yt">
            <div class="icon-label">YouTube</div>
            <span class="sub-text">@pbstattoo</span>
        </a>
    </div>

    <script>
        const observer = new IntersectionObserver((entries) => { entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); }); });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
