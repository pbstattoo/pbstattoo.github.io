<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - PB'S TATTOO</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --surface: #0e0e10; --border: rgba(255, 255, 255, 0.08); --text-primary: #ffffff; --text-secondary: #86868b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text-primary); padding-top: 100px; }
        .reveal { opacity: 0; transform: translateY(40px); transition: all 1s; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        
        header { position: fixed; top: 0; width: 100%; z-index: 1000; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background: rgba(0, 0, 0, 0.75); border-bottom: 1px solid var(--border); }
        nav { max-width: 1120px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
        .logo { display: flex; align-items: center; text-decoration: none; font-size: 1.05rem; font-weight: 800; letter-spacing: 0.1em; color: #fff; }
        .nav-links { display: flex; gap: 28px; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        .nav-links a:hover { color: var(--text-primary); }
        .nav-btn { background: #fff; color: #000 !important; padding: 8px 18px; border-radius: 98px; }

        .container { max-width: 1120px; margin: 0 auto; padding: 40px 24px; }
        h1 { font-size: 3.5rem; text-align: center; margin-bottom: 60px; }

        .showcase-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 60px; }
        .img-card { border-radius: 24px; overflow: hidden; position: relative; aspect-ratio: 4/5; }
        .img-card.wide { grid-column: 1 / -1; aspect-ratio: 21/9; }
        .img-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.5s; filter: grayscale(80%); }
        .img-card:hover img { transform: scale(1.05); filter: grayscale(0%); }
        .img-label { position: absolute; bottom: 30px; left: 30px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 10px 20px; border-radius: 98px; font-weight: 600; font-size: 0.85rem; }

        .bento-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .bento-card { background: var(--surface); border: 1px solid var(--border); padding: 40px; border-radius: 24px; }
        @media (max-width: 860px) { .showcase-grid, .bento-grid { grid-template-columns: 1fr; } .nav-links { display: none; } }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <img src="logo.png" alt="PB'S TATTOO" style="height: 35px; width: auto;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span style="display:none;">PB'S TATTOO</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="gallery.html" style="color: #fff;">Gallery & Styles</a>
                <a href="contact.html" class="nav-btn">Contact</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1 class="reveal">Our Work.</h1>
        
        <div class="showcase-grid">
            <div class="img-card reveal"><img src="https://images.unsplash.com/photo-1598371839696-5c5bb00bdc28?q=80&w=1200&auto=format&fit=crop" alt="Fine Line"><div class="img-label">Fine Line</div></div>
            <div class="img-card reveal"><img src="https://images.unsplash.com/photo-1611501271400-3298a0d927dd?q=80&w=1200&auto=format&fit=crop" alt="Realism"><div class="img-label">Realism</div></div>
        </div>

        <div class="bento-grid">
            <div class="bento-card reveal">
                <h3 style="font-size: 1.5rem; margin-bottom: 10px;">Portraits & Realism</h3>
                <p style="color: var(--text-secondary);">High-contrast, flawless gradients pushing the boundary of lifelike art.</p>
            </div>
            <div class="bento-card reveal">
                <h3 style="font-size: 1.5rem; margin-bottom: 10px;">Blackwork & Dotwork</h3>
                <p style="color: var(--text-secondary);">Heavy saturation alongside delicate micro-dot texture layering.</p>
            </div>
        </div>
    </div>

    <script>
        const observer = new IntersectionObserver((entries) => { entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); }); });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
